name: ☁️ Deploy Cloudflare Web + API

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/ensure_content.py'
      - 'platform.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Exigir conexión Cloudflare
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Faltan CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en GitHub Actions."
            exit 1
          }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar currículo canónico
        run: python scripts/ensure_content.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare
        working-directory: web
        env:
          ASTRO_BASE: /
        run: npm run build
      - name: Aplicar esquema D1
        working-directory: web
        run: npx wrangler d1 execute plataforma --remote --file=./schema.sql
      - name: Deploy Pages + API
        working-directory: web
        run: npx wrangler pages deploy dist --project-name plataforma-total-web
      - name: Probar API real
        run: |
          curl -fsS https://plataforma-total-web.pages.dev/api/health | tee /tmp/health.json
          grep -q '"service":"plataforma-total-api"' /tmp/health.json
          curl -fsS https://plataforma-total-web.pages.dev/api/catalog | grep -q '"courses":57'
