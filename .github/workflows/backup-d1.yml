name: 🗄️ Backup semanal D1

on:
  schedule:
    - cron: '0 4 * * 1'   # lunes 04:00 UTC (01:00 UY)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Exportar D1 a SQL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@4 2>&1 | tail -1
          mkdir -p backups && cd web && wrangler d1 export plataforma --remote --output "../backups/d1-$(date +%F).sql"
      - name: Commit + push del backup
        run: |
          git config user.name "SoftEngAi Backup Bot"
          git config user.email "backup@softengai.dev"
          git add backups/ && git commit -m "🗄️ backup D1 $(date +%F)" || echo "sin cambios"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
