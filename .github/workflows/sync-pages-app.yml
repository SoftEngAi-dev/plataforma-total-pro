name: 🌐 Sincronizar Web/PWA de GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'platform.json'
      - '!docs/app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir web estática para GitHub Pages
        working-directory: web
        env:
          ASTRO_BASE: /plataforma-total-pro/app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Reemplazar docs/app por el build oficial
        run: |
          rm -rf docs/app
          mkdir -p docs/app
          cp -R web/dist/plataforma-total-pro/app/. docs/app/
          touch docs/.nojekyll
      - name: Publicar cambios generados
        run: |
          if git diff --quiet -- docs/app docs/.nojekyll; then
            echo "docs/app ya está actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app docs/.nojekyll
          git commit -m "chore(pages): sync web build from canonical Astro app"
          git push
