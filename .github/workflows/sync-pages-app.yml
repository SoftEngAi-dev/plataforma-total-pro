name: 🌐 Publicar Web/PWA en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/ensure_content.py'
      - 'platform.json'
      - '!docs/app/**'
      - '.github/workflows/sync-pages-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generar currículo canónico
        run: python scripts/ensure_content.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Construir Web/PWA
        working-directory: web
        env:
          ASTRO_BASE: /plataforma-total-pro/app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Sincronizar docs/app
        run: |
          rm -rf docs/app
          mkdir -p docs/app
          if test -d web/dist/plataforma-total-pro/app; then
            cp -R web/dist/plataforma-total-pro/app/. docs/app/
          else
            cp -R web/dist/. docs/app/
          fi
          # GitHub Pages no normaliza todos los directorios como el runtime Cloudflare.
          # Convertimos enlaces internos a index.html sólo en la copia estática.
          python - <<'PY'
          from pathlib import Path
          root = Path("docs/app")
          routes = ["aprender","rutas","lab","proyectos","chat","pomo","progreso","evaluacion","ingles","certificados","pro"]
          for path in root.rglob("*.html"):
              s = path.read_text(encoding="utf-8")
              for route in routes:
                  src = "/plataforma-total-pro/app/" + (route + "/" if route else "")
                  dst = "/plataforma-total-pro/app/" + ("index.html" if not route else route + "/index.html")
                  s = s.replace(src, dst)
              path.write_text(s, encoding="utf-8")
          PY
          touch docs/.nojekyll
      - name: Publicar artefactos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app docs/.nojekyll web/public/data web/public/offline-manifest.json
          if git diff --cached --quiet; then
            echo "Sin cambios generados"
          else
            git commit -m "chore(pages): publish web app and canonical course data"
            git push
          fi
