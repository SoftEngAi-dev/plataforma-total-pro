version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: '06:00' }
    open-pull-requests-limit: 3
    labels: [deps]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [deps, ci]
